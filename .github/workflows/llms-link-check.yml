name: llms.txt link check

# Runs only where the repository variable SITE_URL is set, so a fresh copy of
# this repo never checks someone else's site.
on:
  pull_request:
    branches: [main]
    paths:
      - "public/llms.txt"
      - "scripts/check-llms-links.mjs"
      - ".github/workflows/llms-link-check.yml"
  schedule:
    # Weekly, to catch a slug renamed in Contentful.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-llms-links.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
